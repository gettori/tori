# Delve, Go's debugger. Go's own toolchain installs it, so Tori offers a hint
# rather than an install. `dlv dap` listens on the port Tori picks, serves one
# session and exits with it.
#
# `verified_against` is stated from `dlv version`, not checked: `dlv` has no
# `--version` (`dlv version` prints three lines), so the health card has no
# version to compare and says so.

schema_version = 1
id = "delve"
label = "Go (Delve)"
description = "Debug Go programs and tests with Delve"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
verified_against = "dlv 1.27.2"
verified_on = "2026-10-09"

# The module a package builds in. Delve runs `go build` from its own working
# directory, which is this root.
root_markers = ["go.mod"]

[languages]
go = "go"

[launch]
kind = "tcp"
program = "dlv"
args = ["dap", "--listen=127.0.0.1:{port}"]

[install]
kind = "hint"
text = "Install it with `go install github.com/go-delve/delve/cmd/dlv@latest`, and put `$(go env GOPATH)/bin` on your PATH."
update = "go install github.com/go-delve/delve/cmd/dlv@latest"
uninstall = 'gobin="$(go env GOBIN)"; rm "${gobin:-$(go env GOPATH)/bin}/dlv"'
