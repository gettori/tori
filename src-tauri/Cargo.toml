[package]
name = "sway"
version = "0.1.0"
description = "Dev workflow manager: session tree + Claude terminal + editor"
authors = ["skarif"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.20"
notify = "6"
dirs = "5"
portable-pty = "0.8"
json5 = "0.4"
ureq = { version = "2", features = ["json"] }
regex = "1"
globset = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
tauri-plugin-clipboard-manager = "2.3.2"
# The forge token store. `keyring-core` rather than the all-in-one `keyring`
# crate on that crate's own advice: it says an application that wants to choose
# its credential stores should link core plus the specific store, since `keyring`
# itself exists to serve its CLI and would drag in every platform's backend.
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
# `keychain` is the login keychain (the one a desktop app shares with every
# other credential the user has); `protected` is the data-protection keychain,
# which needs an app-group entitlement Sway does not have.
apple-native-keyring-store = { version = "1", features = ["keychain"] }

