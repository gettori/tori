[package]
name = "tori"
version = "26.1005.1-alpha"
description = "Dev workflow manager: session tree + Claude terminal + editor"
authors = ["skarif"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tori_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.20"
notify = "6"
dirs = "5"
portable-pty = "0.8"
json5 = "0.4"
ureq = { version = "2", features = ["json"] }
regex = "1"
globset = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
tauri-plugin-clipboard-manager = "2.3.2"
# The forge token store. `keyring-core` rather than the all-in-one `keyring`
# crate on that crate's own advice: it says an application that wants to choose
# its credential stores should link core plus the specific store, since `keyring`
# itself exists to serve its CLI and would drag in every platform's backend.
keyring-core = "1"
# Deleting from a file tree means the macOS Trash, never `rm`: a tree delete is
# one wrong click away and must stay recoverable. Default features off because
# they exist for listing/restoring trash contents (and pull `chrono` to do it);
# `trash::delete` is all the editor asks for.
trash = { version = "5.2.6", default-features = false }
# The generic ACP client. Brings the smol stack (`async-io`, `async-process`,
# `futures-lite`, `blocking`) rather than tokio, so it runs on its own dedicated
# thread per session and never becomes a second runtime beside Tauri's.
agent-client-protocol = "2"
# The SDK's stream and channel vocabulary: `ByteStreams` is defined over
# `futures`' `AsyncRead`/`AsyncWrite`, and the command channel feeding the
# connection loop has to be sendable from the sync trait methods.
futures = "0.3"
async-process = "2"
# The handshake deadline. `[[concept_acp_agent_quirks]]` records that an agent
# which never answers `initialize` leaves a client waiting forever, so the
# deadline is Tori's to own - the same finding Phase 1 made about the Claude CLI.
async-io = "2"
# The socket params structs' JSON Schema, which `tori mcp` publishes as each
# tool's `inputSchema`. Already in the tree through the ACP crate.
schemars = "1"
# The WebSocket front a phone connects to. Sync, so it keeps the socket's
# thread per connection model with no async runtime.
base64 = "0.22"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Signals for process groups and liveness on Unix (`platform::process`).
# Already in the lock file under half the tree.
libc = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# The Keychain service name `claude` derives for a non-default CLAUDE_CONFIG_DIR
# is `sha256(dir)[:8]`, so the token rung has to compute one. Already in the
# lock file as a tauri build dependency; this makes it a runtime one too.
sha2 = "0.10"
# GitLab identifies a diff line by a SHA1 of its path, which is the only way to
# anchor a multi-line review comment (`forge/gitlab.rs`).
sha1 = "0.10"
# One process table on every OS: a sweep refreshes it once with command lines
# instead of spawning `pgrep` per agent, and Windows has no `pgrep` or `ps`.
# 0.37 because 0.38 moved to `windows` 0.62, a second copy beside tauri's 0.61.
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
# Interface addresses for the remote front on every OS; `getifaddrs` is Unix only.
if-addrs = "0.15"
# Socket tokens from the OS generator rather than reading `/dev/urandom`.
getrandom = "0.4"
# `canonicalize` on Windows returns a `\\?\` path nothing else accepts. Already
# in the lock file.
dunce = "1"
# Folder and file pickers on every OS, replacing `osascript`.
tauri-plugin-dialog = "2"
# Icon resizing without `sips`. Already in the lock file under tauri.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The notification plugin's desktop send never reports a click, so a needs-you
# notification goes out here, waiting for one. Already in the lock file through
# the plugin's notify-rust. Patched below so a needs-you notification carries
# an id Tori chose, to take it back down once the session no longer needs you.
mac-notification-sys = "0.6"
uuid = { version = "1", features = ["v4"] }
# `keychain` is the login keychain (the one a desktop app shares with every
# other credential the user has); `protected` is the data-protection keychain,
# which needs an app-group entitlement Tori does not have.
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# NSUserDefaults for WebKit's text-checking switches (spell check on, smart
# substitutions off). Already in the tree under tauri; only the features are new.
objc2-foundation = { version = "0.3", features = ["NSUserDefaults", "NSString", "NSData", "NSArray", "NSUserNotification"] }
# NSApplication.setApplicationIconImage for the Dock icon, and NSSound for the
# sounds a session state plays. Both already in the tree under tauri; only the
# features are new.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSPasteboard", "NSSound"] }

[target.'cfg(windows)'.dependencies]
# AF_UNIX on Windows 10 1803+ with std's `UnixStream` API, timeouts and shutdown
# included, so every socket above `platform::ipc` stays one type. Named pipes
# (interprocess) have no I/O timeouts on Windows. Already in the lock file.
uds_windows = "1.2"
# A directory junction when a `.shared` symlink needs Developer Mode.
junction = "2"
# Whether a hardlinked `.shared` file is its target; std has no stable file id
# on Windows. Already in the lock file.
same-file = "1"
# The forge token store: Credential Manager, as the Keychain is on macOS.
windows-native-keyring-store = "1"
# Job Objects for process trees, process liveness, owner-only DACLs, PlaySoundW
# and the keep-awake power request. 0.61 is the one already in the lock file under tauri.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Power", "Win32_System_SystemServices", "Win32_Security_Authorization", "Win32_Media_Audio"] }
# Off macOS the crate refuses to compile unless one COM model is chosen, and the
# defaults that pick it are off above. Apartment, because the main thread is
# already an STA under WebView2.
trash = { version = "5.2.6", default-features = false, features = ["coinit_apartmentthreaded"] }

# 0.6.15 plus an `identifier` builder option; drop this once upstream has one.
[patch.crates-io]
mac-notification-sys = { path = "vendor/mac-notification-sys" }
