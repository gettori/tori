# Bundled TypeScript/JavaScript server. Tori ships this one (see
# `pnpm lsp:install`), so it is the only config using the `bundled_node`
# launch kind. See LSP-SERVERS.md for the schema.

schema_version = 1
id = "typescript"
label = "TypeScript / JavaScript"
description = "TypeScript and JavaScript, through typescript-language-server"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
verified_against = "typescript-language-server 4.4.1"
verified_on = "2026-10-09"

# `tsconfig.json`/`jsconfig.json` first so a package inside a monorepo gets a
# server rooted at its own compiler config rather than at the repo root.
root_markers = ["tsconfig.json", "jsconfig.json", "package.json", ".git"]

# tsserver answers from a warm project quickly, but a cold first `initialize`
# on a large repo can take a few seconds. The library's own default is 3s,
# which is too tight for the first request after a project opens.
request_timeout_ms = 20000

# The server prefers the workspace's own `node_modules/typescript` to the
# bundled one and loads tsconfig `plugins`, so opening a file runs project code.
runs_project_code = true

[languages]
ts = "typescript"
mts = "typescript"
cts = "typescript"
tsx = "typescriptreact"
js = "javascript"
mjs = "javascript"
cjs = "javascript"
jsx = "javascriptreact"

[launch]
kind = "bundled_node"
entry = "resources/lsp/node_modules/typescript-language-server/lib/cli.mjs"
args = ["--stdio"]

# Code lens, off in the server until it is told otherwise (wave 7, #68).
#
# Without this table `textDocument/codeLens` answers an empty array: the server
# advertises `codeLensProvider` unconditionally, but both providers check the
# *workspace configuration* before producing anything (`cli.mjs:21364`), and a
# preference nobody sent reads as off. Verified both ways against the bundled
# 4.4.1: no table, 0 lenses; this table, 3 lenses on a file with three exported
# symbols. So Tori's own `codeLens` setting would have drawn nothing for
# TypeScript without it.
#
# Read out of the *workspace* configuration and not out of
# `initialization_options`, which is what it looks like it should be: the
# provider calls `getWorkspacePreferencesForFile` (`cli.mjs:21129`), which
# indexes this table by `typescript`/`javascript`, so the mechanism that works
# is the one used here. (`initialization_options` reached no primary server at
# all until the `lsp-client` 6.3.0 bump, which is the other reason.)
#
# Enabling it here costs nothing while Tori's setting is off, because the
# expense is in the request and Tori does not make one: `provideCodeLenses`
# runs per request, and the reference counting is in `codeLens/resolve`.
#
# `showOnAllFunctions` is deliberately not set. On it, every inner helper gets a
# lens, most of them reading "0 references"; the default keeps them to exported
# and class members, which is what the counts are worth reading for.
[settings.typescript.referencesCodeLens]
enabled = true

[settings.typescript.implementationsCodeLens]
enabled = true

[settings.javascript.referencesCodeLens]
enabled = true

[settings.javascript.implementationsCodeLens]
enabled = true
