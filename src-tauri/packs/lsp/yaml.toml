# Bundled YAML server: `yaml-language-server`, the one behind Red Hat's VS Code
# YAML extension. Installed by `pnpm lsp:install`. See LSP-SERVERS.md.
#
# This server brings its own SchemaStore support, so unlike the JSON one it
# needs no catalog from Tori - only for `[settings]` below to reach it. Which is
# less obvious than it sounds: it answers `workspace/didChangeConfiguration` by
# *pulling* its configuration back with `workspace/configuration`, and it is
# that answer, not the push, that carries these values.

schema_version = 1
id = "yaml"
label = "YAML"
description = "YAML with SchemaStore schemas, through yaml-language-server"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }

# `.git` alone, for `json.toml`'s reason: nothing about this server is
# per-package, so a marker that appears in every package of a monorepo would
# buy a session per package and no correctness.
root_markers = [".git"]

verified_against = "yaml-language-server 1.24.0"
verified_on = "2026-08-05"

# Reads documents and fetches schemas but executes nothing from the project, so
# it keeps working in a project the user has not trusted.
runs_project_code = false

[languages]
yaml = "yaml"
yml = "yaml"

[launch]
kind = "bundled_node"
entry = "resources/lsp/node_modules/yaml-language-server/bin/yaml-language-server"
args = ["--stdio"]

# The server's own defaults are these values, but a default it never reads is
# not a default it applies: its schema store is only built inside the
# configuration handler, which does not run until a configuration arrives. So
# this table is what turns SchemaStore on, restating the defaults rather than
# changing them.
[settings.yaml]
validate = true
completion = true
hover = true

[settings.yaml.schemaStore]
enable = true
url = "https://www.schemastore.org/api/json/catalog.json"
