# Ruby via `ruby-lsp`, which its own toolchain installs, so Tori
# offers a hint rather than an install. See LSP-SERVERS.md.

schema_version = 1
id = "ruby"
label = "Ruby"
description = "Ruby, through Ruby LSP"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
verified_against = "ruby-lsp 0.26.11"
verified_on = "2026-10-09"
root_markers = ["Gemfile", ".git"]

# Boots the project's bundle to read its gems.
runs_project_code = true

[languages]
rb = "ruby"
rake = "ruby"
gemspec = "ruby"

[launch]
kind = "path"
program = "ruby-lsp"
args = []

[install]
kind = "hint"
text = "Install it with `gem install ruby-lsp`."
update = "gem update ruby-lsp"
uninstall = "gem uninstall --all --executables ruby-lsp"
