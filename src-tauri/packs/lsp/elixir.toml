# Elixir via `elixir-ls`, which its own toolchain installs, so Tori
# offers a hint rather than an install. See LSP-SERVERS.md.

schema_version = 1
id = "elixir"
label = "Elixir"
description = "Elixir, through ElixirLS"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
verified_against = "elixir-ls 0.31.1"
verified_on = "2026-10-09"
root_markers = ["mix.exs", ".git"]
# Outside a Mix project elixir-ls builds nothing and only reports that it found
# no mixfile, so a loose script gets highlighting and no server.
activation_markers = ["mix.exs"]
request_timeout_ms = 120000

# Compiles the project with mix, and macros run at compile time.
runs_project_code = true

[languages]
ex = "elixir"
exs = "elixir"

[launch]
kind = "path"
program = "elixir-ls"
args = []

[install]
kind = "hint"
text = "Install it with `brew install elixir-ls`."
update = "brew upgrade elixir-ls"
uninstall = "brew uninstall elixir-ls"
