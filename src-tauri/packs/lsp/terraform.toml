# Terraform via `terraform-ls`, which its own toolchain installs, so Tori
# offers a hint rather than an install. See LSP-SERVERS.md.

schema_version = 1
id = "terraform"
label = "Terraform"
description = "Terraform, through terraform-ls"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
verified_against = "terraform-ls 0.39.0"
verified_on = "2026-10-09"
root_markers = [".terraform", ".git"]

# Asks the project's providers for their schemas, which runs them.
runs_project_code = true

[languages]
tf = "terraform"
tfvars = "terraform-vars"

[launch]
kind = "path"
program = "terraform-ls"
args = ["serve"]

[install]
kind = "hint"
text = "Install it with `brew install hashicorp/tap/terraform-ls`."
update = "brew upgrade hashicorp/tap/terraform-ls"
uninstall = "brew uninstall hashicorp/tap/terraform-ls"
