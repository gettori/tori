# C# via `csharp-ls`, which its own toolchain installs, so Tori
# offers a hint rather than an install. See LSP-SERVERS.md.

schema_version = 1
id = "csharp"
label = "C#"
description = "C#, through csharp-ls"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
verified_against = "csharp-ls 0.28.0"
verified_on = "2026-10-09"
root_markers = ["global.json", ".git"]
request_timeout_ms = 120000

# Loads the solution through MSBuild, which runs the project's build tasks.
runs_project_code = true

[languages]
cs = "csharp"

[launch]
kind = "path"
program = "csharp-ls"
args = []

[install]
kind = "hint"
text = "Install it with `dotnet tool install --global csharp-ls`."
update = "dotnet tool update --global csharp-ls"
uninstall = "dotnet tool uninstall --global csharp-ls"
