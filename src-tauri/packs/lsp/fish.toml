# fish via fish-lsp. It needs `fish` itself on the PATH. See LSP-SERVERS.md.

schema_version = 1
id = "fish"
label = "fish"
description = "fish shell scripts, through fish-lsp"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
verified_against = "fish-lsp 1.1.4"
verified_on = "2026-10-09"
root_markers = [".git"]

# Runs `fish` over the files it serves.
runs_project_code = true

[languages]
fish = "fish"

[launch]
kind = "managed"
runtime = "node"
program = "fish-lsp"
args = ["start"]

[install]
kind = "npm"
package = "fish-lsp"
version = "1.1.4"
