# Zig via `zls`, which its own toolchain installs, so Tori
# offers a hint rather than an install. See LSP-SERVERS.md.

schema_version = 1
id = "zig"
label = "Zig"
description = "Zig, through ZLS"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
verified_against = "zls 0.16.0"
verified_on = "2026-10-09"
root_markers = ["build.zig", ".git"]

# Runs `build.zig` to learn the build.
runs_project_code = true

[languages]
zig = "zig"
zon = "zig"

[launch]
kind = "path"
program = "zls"
args = []

[install]
kind = "hint"
text = "Install the zls release that matches your Zig version, see zigtools.org/zls/install."
