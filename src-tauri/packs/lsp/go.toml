# Go via `gopls`, which its own toolchain installs, so Tori
# offers a hint rather than an install. See LSP-SERVERS.md.

schema_version = 1
id = "go"
label = "Go"
description = "Go, through gopls"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
verified_against = "gopls v0.23.0"
verified_on = "2026-10-09"
root_markers = ["go.work", "go.mod", ".git"]
request_timeout_ms = 60000

# Loads packages through `go list`, which can fetch the toolchain go.mod names.
runs_project_code = true

[languages]
go = "go"

[launch]
kind = "path"
program = "gopls"
args = []

[install]
kind = "hint"
text = "Install it with `go install golang.org/x/tools/gopls@latest`."
update = "go install golang.org/x/tools/gopls@latest"
uninstall = 'gobin="$(go env GOBIN)"; rm "${gobin:-$(go env GOPATH)/bin}/gopls"'
