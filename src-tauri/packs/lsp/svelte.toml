# Svelte via svelte-language-server. See LSP-SERVERS.md.

schema_version = 1
id = "svelte"
label = "Svelte"
description = "Svelte components, through the Svelte language server"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
verified_against = "svelte-language-server 0.18.4"
verified_on = "2026-10-09"
root_markers = ["svelte.config.js", "package.json", ".git"]

# Loads the project's `svelte.config.js` and its preprocessors.
runs_project_code = true

[languages]
svelte = "svelte"

[launch]
kind = "managed"
runtime = "node"
program = "svelteserver"
args = ["--stdio"]

[install]
kind = "npm"
package = "svelte-language-server"
version = "0.18.4"
