# OCaml via `ocamllsp`, which its own toolchain installs, so Tori
# offers a hint rather than an install. See LSP-SERVERS.md.

schema_version = 1
id = "ocaml"
label = "OCaml"
description = "OCaml, through ocaml-lsp"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
verified_against = "ocaml-lsp-server 1.26.0 (OCaml 5.4.1)"
verified_on = "2026-10-09"
root_markers = ["dune-project", "dune-workspace", ".git"]

# Reads what dune builds, and ppx rewriters run during that build.
runs_project_code = true

[languages]
ml = "ocaml"
mli = "ocaml.interface"

[launch]
kind = "path"
program = "ocamllsp"
args = []

[install]
kind = "hint"
text = "Install it with `opam install ocaml-lsp-server`."
update = "opam upgrade ocaml-lsp-server"
uninstall = "opam remove ocaml-lsp-server"
