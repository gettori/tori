schema_version = 2
id = "pi"
label = "Pi"
description = "The pi coding agent, with chat over ACP"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
icon = "pi"

# Measured with `node dev/acp-probe.mjs --agent pi-acp`. Two versions, as in
# codex.toml: the PTY tab runs `pi`, the chat surface runs the pinned bridge,
# and `pi`'s version comes first because that is what health.rs compares.
verified_against = "pi 0.82.1 with pi-acp 0.0.33"
verified_on = "2026-10-09"

[launch]
program = "pi"
# The TUI, for a PTY tab. Nothing to do with the chat surface below, which
# launches the ACP bridge instead.
base_args = []
# No yolo_args: whether pi has an approve-everything flag is unmeasured, and a
# guessed flag is worse than no button.
yolo_args = []
# Empty: the UI reads this as "this agent's sessions can't be resumed" rather
# than mis-resuming. See opencode.toml for why an ACP row's id is Tori's own.
resume_args = []

# No [discovery], [parser] or [running]: a protocol-backed adapter reaches its
# sessions through ACP, never through files. See opencode.toml.

[capabilities]
pty_quiet_ms = 2000
# Not claimed, and here not measurable at all until the CLI is installed.
needs_you = false
hooks = false

[chat]
transport = "acp"

# Its model names arrive as a "Provider/Name" path, sometimes with a vendor
# prefix on the name itself ("openrouter/Amazon: Nova 2 Lite" over
# "openrouter/amazon/nova-2-lite-v1"; observed, not pinned: see the missing
# verified_against above).
# Lets the picker split them for display; the wire id is never rewritten.
split_model_names = true
# Like Codex, the chat binary is not the launch binary: `pi` has no ACP mode
# of its own, so chat goes through `pi-acp`, a bridge that spawns the
# **installed** `pi --mode rpc` from PATH and reuses pi's own sessions
# (`~/.pi/agent/sessions/`). Unlike claude-agent-acp it vendors no second
# agent: its only dependencies are the ACP SDK and zod, so the pi that answers
# is the one the user installed (its README requires pi v0.80.4+). The one
# caveat worth naming: the bridge is third-party (svkozak/pi-acp), not the pi
# author's, which is a reason to pin and re-measure rather than a reason to
# avoid it.
program = "npx"
# Pinned to the version the ACP Registry pins, matching codex.toml's practice:
# unpinned, the bridge would silently move underneath any future measurement.
base_args = ["-y", "pi-acp@0.0.33"]

# All empty for the same reason as opencode's: ACP carries sessions, models and
# modes in the protocol rather than on the command line.
session_id_args = []
resume_args = []
fork_args = []
model_args = []
effort_args = []
mode_args = []
add_dir_args = []

# No [[chat.models]]: whatever this agent advertises on its handshake is what
# the picker will show.

[chat.acp]
# Left at the safe default, like every unmeasured ACP adapter.
#
# pi-acp 0.0.33 accepts a populated `mcpServers` and never starts the servers
# (dev/mcp-probe.mjs --acp), so `send_mcp_servers` stays off.
serve_client_fs = false
