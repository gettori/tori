# Vim script via vim-language-server. See LSP-SERVERS.md.

schema_version = 1
id = "vim"
label = "Vim script"
description = "Vim script, through vim-language-server"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
verified_against = "vim-language-server 2.3.1"
verified_on = "2026-10-09"
root_markers = [".git"]

runs_project_code = false

[languages]
vim = "vim"

[launch]
kind = "managed"
runtime = "node"
program = "vim-language-server"
args = ["--stdio"]

[install]
kind = "npm"
package = "vim-language-server"
version = "2.3.1"
