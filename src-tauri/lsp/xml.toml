# XML via LemMinX, the native build the VS Code XML extension ships. See
# LSP-SERVERS.md.

schema_version = 1
id = "xml"
label = "XML (LemMinX)"
root_markers = [".git"]

# Validates against schemas; it may download them, but runs nothing.
runs_project_code = false

[languages]
xml = "xml"
xsd = "xml"
xsl = "xml"
xslt = "xml"

[launch]
kind = "managed"
runtime = "native"
program = "lemminx"
args = []

[install]
kind = "github_release"
repo = "redhat-developer/vscode-xml"
version = "0.29.3"

[install.assets.macos-aarch64]
file = "lemminx-osx-aarch_64.zip"
sha256 = "185db5630ce85be43ea0fab034e7841b1327c2793db05ab481e029cf493d86ce"
bin = "lemminx-osx-aarch_64"

[install.assets.macos-x86_64]
file = "lemminx-osx-x86_64.zip"
sha256 = "9e56123194b5c1fdc7d87f1bd21c83cc996ba7be913def3a2836a13305bcd273"
bin = "lemminx-osx-x86_64"

[install.assets.windows-x86_64]
file = "lemminx-win32.zip"
sha256 = "7eaefaac68253b0ec8e0ad1f1c0f2d0755423d4e99e52497428b52f80df28eb7"
bin = "lemminx-win32.exe"
