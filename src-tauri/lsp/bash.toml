# Bash via bash-language-server. See LSP-SERVERS.md.

schema_version = 1
id = "bash"
label = "Bash"
description = "Bash and sh scripts, through bash-language-server"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
verified_against = "bash-language-server 5.8.1"
verified_on = "2026-10-09"
root_markers = [".git"]

# Parses scripts and hands them to shellcheck; it runs none of them.
runs_project_code = false

[languages]
sh = "shellscript"
bash = "shellscript"

[launch]
kind = "managed"
runtime = "node"
program = "bash-language-server"
args = ["start"]

[install]
kind = "npm"
package = "bash-language-server"
version = "5.8.1"
