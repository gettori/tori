# Elm via elm-language-server. It needs `elm` itself on the PATH for
# diagnostics. See LSP-SERVERS.md.

schema_version = 1
id = "elm"
label = "Elm"
description = "Elm, through elm-language-server"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
verified_against = "@elm-tooling/elm-language-server 2.8.0"
verified_on = "2026-10-09"
root_markers = ["elm.json", ".git"]

# Compiles with `elm make`, which runs nothing from the project.
runs_project_code = false

[languages]
elm = "elm"

[launch]
kind = "managed"
runtime = "node"
program = "elm-language-server"
args = ["--stdio"]

[install]
kind = "npm"
package = "@elm-tooling/elm-language-server"
version = "2.8.0"
