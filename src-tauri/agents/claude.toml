schema_version = 2
id = "claude"
label = "Claude"
# The CLI these conventions were empirically captured against. The chat
# transport below is a measurement of this version's wire format, so a drift
# warning against a newer binary is meaningful rather than cosmetic.
verified_against = "claude 2.1.220"

[launch]
program = "claude"
base_args = []
yolo_args = ["--dangerously-skip-permissions"]
resume_args = ["--resume", "{id}"]

[discovery]
dir = "~/.claude/projects"
filename_pattern = '^(?P<id>.+)\.jsonl$'

[parser]
kind = "claude_jsonl"

[running]
# ERE for `pgrep -f`; matches a live claude process driving this session id, not
# merely any process whose command line contains the id (a `less`/`tail` on the
# transcript file, an editor with it open).
#
# The `([^ ]+ )*` is load-bearing, and was measured rather than assumed. The
# original `claude (--resume|-r) {id}` required the flag to sit immediately
# after the program name, which is true of a PTY agent tab (`claude --resume
# <id>`) but false of **every chat session**: the chat transport puts its
# base_args first, so the real command line is `claude -p --input-format
# stream-json ... --resume <id>`. Chats were therefore invisible to
# `session_running`, and so to every guard built on it. A new chat was doubly
# invisible, since it is started with `--session-id` and never `--resume`.
#
# Matching a run of whole argument tokens keeps the decoys out: a `tail` on
# `~/.claude/projects/<p>/<id>.jsonl` has no flag token before the id.
pattern = 'claude ([^ ]+ )*(--resume|-r|--session-id) {id}'

[capabilities]
# Empirically confirmed (2026-07-18, phase 2 capture): a real permission
# prompt (`--permission-mode plan`, "Would you like to proceed?") leaves the
# PTY fully silent for 9s+ while waiting; a 20s Bash tool run stays noisy
# throughout (spinner redraws every <=0.62s). 2000ms sits well above the
# noisy-phase gaps and far below the observed blocked-silence duration.
pty_quiet_ms = 2000
needs_you = true
# Verified (2026-07-18, phase 3 spike + capture): `--settings <inline JSON>`
# injects a `Notification`/`UserPromptSubmit`/`PreToolUse`/`Stop` hook set
# without touching ~/.claude/settings.json (see crate::hooks); Notification
# fires when claude itself decides it needs the user (a permission prompt or
# an idle nudge), replacing the quiet-PTY x pending-tool_use guess with a
# ground-truth signal for Sway-launched sessions only.
hooks = true

# --- schema v2: the structured chat transport ---
#
# Everything below was measured against the CLI named in `verified_against`,
# not read from documentation; `dev/protocol-probe.mjs` re-verifies the wire
# format these args produce.
#
# NOTE: every scalar key here must stay above the first [[chat.*]] header. A
# TOML key written after a table header belongs to that table, so moving one
# down silently reparents it.
[chat]
transport = "claude_stream_json"
# `-p` with stream-json both ways, and stdin held open for the life of the
# session. Closing stdin is what made early probes exit after a single turn;
# the CLI itself is happy to run many.
base_args = [
  "-p",
  "--input-format", "stream-json",
  "--output-format", "stream-json",
  "--verbose",
  "--include-partial-messages",
  # Puts the user's own hooks in the transcript in-band. Sway's injected
  # approval hook rides the same stream and is folded away by default (it
  # stamps its own output so it can be told apart; `hook_name` reports the
  # tool, not the matcher, so the name cannot identify it).
  "--include-hook-events",
]
session_id_args = ["--session-id", "{id}"]
resume_args = ["--resume", "{id}"]
# Forking replays an existing conversation into a **new** session id. Measured:
# `--resume <old> --fork-session --session-id <new>` honours the id we pass and
# reports it back, which is what lets Sway claim the fork before starting it -
# a CLI-chosen id would be claimed only after the fact, if at all. `{from}` is
# the session being forked; `{id}` is the new one, and the template carries both
# because a fork is the one case where the two differ.
fork_args = ["--resume", "{from}", "--fork-session", "--session-id", "{id}"]
model_args = ["--model", "{model}"]
effort_args = ["--effort", "{effort}"]
mode_args = ["--permission-mode", "{mode}"]
add_dir_args = ["--add-dir", "{dir}"]

# Context windows are the published figures for these models; the meter only
# renders when a window is declared, so an unknown model shows no denominator
# rather than a wrong one.
[[chat.models]]
id = "claude-opus-5"
label = "Opus 5"
context_window = 200000
effort_levels = ["low", "medium", "high", "xhigh", "max"]
supports_thinking = true
supports_images = true
# The live catalogue carries no fast-mode flag; the only thing the CLI says is
# the `/fast` command describing itself as "Toggle fast mode (Opus 5)". Declared
# here so the control has a source at all - PHASE 3 MUST PROVE THIS BY PROBE and
# correct it if the measurement disagrees.
fast_mode = true

[[chat.models]]
id = "claude-sonnet-5"
label = "Sonnet 5"
context_window = 200000
effort_levels = ["low", "medium", "high", "xhigh", "max"]
supports_thinking = true
supports_images = true

[[chat.models]]
id = "claude-haiku-4-5-20251001"
label = "Haiku 4.5"
context_window = 200000
effort_levels = []
supports_thinking = false
supports_images = true

# The four permission modes. Sway's own PreToolUse hook runs ahead of all of
# them, so `bypassPermissions` still prompts for a tool matching no allow
# rule - hooks run first in claude's permission chain.
[[chat.modes]]
id = "default"
label = "Ask"
args = ["--permission-mode", "default"]
# What a session runs when nothing is chosen, and what an unresolvable mode
# downgrades to. Marked rather than assumed: "default" is Claude's spelling,
# and the resolver that reads this must not carry it to another harness.
default = true

[[chat.modes]]
id = "acceptEdits"
label = "Accept edits"
args = ["--permission-mode", "acceptEdits"]

[[chat.modes]]
id = "plan"
label = "Plan"
args = ["--permission-mode", "plan"]

[[chat.modes]]
id = "bypassPermissions"
label = "Bypass"
args = ["--permission-mode", "bypassPermissions"]

# The five levels `--effort` accepts, confirmed present on this CLI.
[[chat.effort]]
id = "low"
label = "Low"
args = ["--effort", "low"]

[[chat.effort]]
id = "medium"
label = "Medium"
args = ["--effort", "medium"]

[[chat.effort]]
id = "high"
label = "High"
args = ["--effort", "high"]

[[chat.effort]]
id = "xhigh"
label = "Extra high"
args = ["--effort", "xhigh"]

[[chat.effort]]
id = "max"
label = "Max"
args = ["--effort", "max"]
