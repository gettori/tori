schema_version = 2
id = "kimi"
label = "Kimi"
icon = "kimi"

# **No `verified_against`, and that is the load-bearing part of this file.**
#
# The key names the CLI version an adapter's conventions were empirically
# captured against. `kimi` (MoonshotAI's kimi-cli) is not installed on the
# machine this was written on, so nothing here has been measured: the launch
# command is read from the ACP Registry's entry, whose `kimi acp` subcommand is
# first-party in the CLI itself, and everything else is the ACP transport's own
# default behaviour. Absent rather than guessed, because a version string here
# would claim a measurement that never happened, and the Agents settings
# surface reads this key to tell a measured agent from an untested one.
# Re-measure with `node dev/acp-probe.mjs --agent kimi` on a machine that has
# it, then pin the version.

[launch]
program = "kimi"
base_args = []
# No yolo_args: whether kimi-cli has an approve-everything flag is unmeasured,
# and a guessed flag is worse than no button.
yolo_args = []
# Empty: the UI reads this as "this agent's sessions can't be resumed" rather
# than mis-resuming. See opencode.toml for why an ACP row's id is Tori's own.
resume_args = []

# No [discovery], [parser] or [running]: a protocol-backed adapter reaches its
# sessions through ACP, never through files. See opencode.toml.

[capabilities]
pty_quiet_ms = 2000
# Not claimed, and here not measurable at all until the CLI is installed.
needs_you = false
hooks = false

[chat]
transport = "acp"
# `kimi acp` is kimi-cli's first-party ACP mode, the same shape as
# `opencode acp`.
base_args = ["acp"]

# All empty for the same reason as opencode's: ACP carries sessions, models and
# modes in the protocol rather than on the command line.
session_id_args = []
resume_args = []
fork_args = []
model_args = []
effort_args = []
mode_args = []
add_dir_args = []

# No [[chat.models]]: whatever this agent advertises on its handshake is what
# the picker will show.

[chat.acp]
# Left at the safe default, like every unmeasured ACP adapter.
serve_client_fs = false
