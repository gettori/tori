schema_version = 1
id = "pi"
label = "Pi"

[launch]
program = "pi"
base_args = []
# pi has no distinct "skip permissions" flag - it launches in yolo mode by
# default, so the yolo variant adds no extra args.
yolo_args = []
resume_args = ["--session", "{file}"]

[discovery]
dir = "~/.pi/agent/sessions"
filename_pattern = '^(?P<id>.+)\.jsonl$'

[parser]
kind = "pi_jsonl"

[running]
pattern = 'pi --session .*{id}'

[capabilities]
pty_quiet_ms = 2000
# Empirically confirmed (2026-07-18, phase 2 capture): pi's built-in bash/
# write/edit tools never block on a permission prompt, so the quiet-PTY x
# pending-tool_use join has no genuine "blocked" state to verify against for
# pi - a trailing tool_use plus a quiet PTY here would mean "still running"
# or "hung", not "waiting on you". Needs-you stays off until that changes;
# pi's dot caps at working.
needs_you = false
