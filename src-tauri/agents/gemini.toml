schema_version = 2
id = "gemini"
label = "Gemini"
description = "Google's Gemini CLI, with chat over ACP"
license = "Apache-2.0"
contributor = { name = "Tori", github = "gettori" }
icon = "gemini"

# **No `verified_against`, and `every_bundled_pack_is_measured` exempts it.**
#
# Gemini CLI 0.63.0 answers `initialize` over `--acp`, but on 2026-10-09 Google
# refused `session/new` for an individual account: "This client is no longer
# supported for Gemini Code Assist for individuals", pointing at Antigravity.
# Whether a paid or enterprise account still gets through is unmeasured, so no
# version is claimed. Replacing or dropping this pack is its own decision.

[launch]
program = "gemini"
base_args = []
# Gemini CLI's own "approve everything" flag. Untested, like everything here.
yolo_args = ["--yolo"]
# Empty: the UI reads this as "this agent's sessions can't be resumed" rather
# than mis-resuming. See opencode.toml for why an ACP row's id is Tori's own.
resume_args = []

# No [discovery], [parser] or [running]: a protocol-backed adapter reaches its
# sessions through ACP, never through files. See opencode.toml.

[capabilities]
pty_quiet_ms = 2000
# Not claimed, and here not measurable at all until the CLI is installed.
needs_you = false
hooks = false

[chat]
transport = "acp"
# `gemini --acp` is Gemini CLI's first-party ACP mode.
base_args = ["--acp"]

# All empty for the same reason as opencode's: ACP carries sessions, models and
# modes in the protocol rather than on the command line.
session_id_args = []
resume_args = []
fork_args = []
model_args = []
effort_args = []
mode_args = []
add_dir_args = []

# No [[chat.models]]: whatever this agent advertises on its handshake is what
# the picker will show. Declaring a table here would be a guess that overrides
# nothing (the live catalogue wins) until the day it is the only list, which is
# exactly the day it would be wrong.

[chat.acp]
# Left at the safe default. [[concept_acp_agent_quirks]] records that Gemini CLI
# can open a browser sign-in when probed, which `NO_BROWSER` suppresses; that is
# a probe-time concern rather than an adapter setting.
serve_client_fs = false

[install]
# npm names the package that ships the launch binary, and all three verbs were
# run on macOS. The binary lands in npm's global bin, which has to be on the
# login shell's PATH for Tori to find it.
program = "npm"
args = ["install", "-g", "@google/gemini-cli"]
update_args = ["install", "-g", "@google/gemini-cli"]
uninstall_args = ["uninstall", "-g", "@google/gemini-cli"]
