schema_version = 1
id = "opencode"
label = "opencode"
verified_against = "opencode 1.18.3"

[launch]
# The official curl installer puts this at ~/.opencode/bin/opencode, which is
# NOT added to PATH by default (confirmed 2026-07-18) - if launches silently
# fail to find the binary, either add that dir to PATH or point `program` at
# the absolute path via a `~/.config/sway/agents/opencode.toml` override.
program = "opencode"
base_args = []
# --auto auto-approves permissions not explicitly denied. Empirically
# confirmed (2026-07-18, phase 2 capture): opencode's default `build` agent
# already auto-executes bash with no gate, so this mirrors the default
# behavior rather than loosening it.
yolo_args = ["--auto"]
resume_args = ["--session", "{id}"]

[discovery]
backend = "sqlite"
# One shared DB across every project on the machine, not a per-project dir
# (see ADAPTERS.md).
db_path = "~/.local/share/opencode/opencode.db"

[parser]
kind = "opencode_sqlite"

[running]
pattern = 'opencode.*--session {id}'

[capabilities]
pty_quiet_ms = 2000
# Empirically confirmed (2026-07-18, phase 2 capture, real pty session): no
# permission prompt appears for opencode's default `build` agent (bash runs
# unguarded), and the TUI redraws continuously while working - no observable
# blocked-and-quiet state to verify the needs-you join against. Same
# rationale as pi; see ADAPTERS.md.
needs_you = false
