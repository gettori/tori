blank_issues_enabled: false
contact_links:
  - name: Installing Tori (Gatekeeper, "Apple could not verify")
    url: https://github.com/gettori/tori/blob/main/docs/INSTALL.md
    about: >
      macOS blocking the first launch is expected: Tori is not signed yet. The
      install doc has the two ways past it.
  - name: Contribute a pack
    url: https://github.com/gettori/packs
    about: >
      Languages, debuggers, formatters, themes and agents are packs, not code.
      gettori/packs takes pull requests for them.
  - name: Ask a question or float an idea
    url: https://github.com/gettori/tori/discussions
    about: >
      Discussions are for questions, setups and half-formed ideas. An issue is
      for something specific to fix or build.
  - name: Report a security problem
    url: https://github.com/gettori/tori/security/advisories/new
    about: >
      Privately, not as an issue. SECURITY.md says what counts and what to
      expect.
