# Point the Homebrew tap at a *published* release on this repo, by hand. The
# release workflow does this itself as its last step; this is for the day
# that step fails after the release is already public, or for a cask edit the
# template in update-cask.sh needs re-rolled onto the current release.
#
# The tap is gettori/tap to brew and the gettori/homebrew-tap repo to git; the
# prefix is what lets `brew install --cask gettori/tap/tori` tap it on its own.
name: Update cask

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published release version, without the v prefix (e.g. 26.1016.0-alpha)"
        required: true

permissions:
  contents: read

jobs:
  cask:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite and push the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: .github/scripts/update-cask.sh "${{ inputs.version }}"
