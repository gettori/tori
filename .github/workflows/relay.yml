# Deploys the push relay in relay/ to Cloudflare. Only a change under relay/
# on main starts it, so an app release never redeploys the relay.
#
# The Cloudflare token lives on the `relay` environment, limited to main and
# gated on a required reviewer, so no run can read it until it is approved.
# A token that can replace the relay could make it log every phone's push
# token, which is why approval is per run and not per branch. The Worker's own
# secrets (HANDLE_KEY, FCM_SERVICE_ACCOUNT) are set once with
# `wrangler secret put` and never pass through here.
name: Relay

on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

concurrency:
  group: relay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: relay
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - run: pnpm --dir relay run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
