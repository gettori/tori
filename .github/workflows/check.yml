# The gate: type-check, the vitest suite, both vite builds and the Rust tests,
# on every push and PR. Each job runs one target of scripts/check.sh, so the
# list of checks lives there and a local `scripts/check.sh all` is this run.
#
# It exists because a guard nothing runs is only a suggestion. `src/lib/` holds
# the whole of Tori's contact surface with its headless-primitives library, and
# `src/lib/boundary.test.ts` is what keeps it that way - but a boundary test
# that only runs when someone remembers to run it will be breached by the first
# contributor who does not.
#
# `tsc --noEmit` is here for a related reason: `pnpm build` is `vp build`,
# which transpiles without type-checking, so nothing else in the repo would
# ever notice a type error.
#
# The `rust` job runs on macOS because Tori is macOS only: a Linux runner is
# cheaper and would not compile the same code. It runs the tests and builds no
# bundle; that is still release.yml's. The `audit` job only reads the lockfiles.
name: Check

# Every pull request, plus main after a merge. Not bare `on: push`, which would
# run this a second time for each PR branch and would also fire on the `v*`
# tags release.yml already builds. By hand too, so a red main can be re-run
# without a commit to hang it on.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: scripts/check.sh ts

  rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The version rust-toolchain.toml pins, so a new stable release cannot
      # turn this red without a commit.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            mobile/src-tauri

      - run: scripts/check.sh rust

  # Its own job, so an advisory published overnight reads as an advisory and
  # not as a broken test run.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit

      - run: scripts/check.sh audit

  packs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - run: scripts/check.sh packs
