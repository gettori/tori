# The gate: type-check, the vitest suite and the Rust tests, on every push and PR.
#
# It exists because a guard nothing runs is only a suggestion. `src/lib/` holds
# the whole of Tori's contact surface with its headless-primitives library, and
# `src/lib/boundary.test.ts` is what keeps it that way - but a boundary test
# that only runs when someone remembers to run it will be breached by the first
# contributor who does not.
#
# `tsc --noEmit` is here for a related reason: `pnpm build` is `vite build`,
# which transpiles without type-checking, so nothing else in the repo would
# ever notice a type error.
#
# The `rust` job runs on macOS because Tori is macOS only: a Linux runner is
# cheaper and would not compile the same code. It runs the tests and builds no
# bundle; that is still release.yml's. The `audit` job only reads the lockfiles.
name: Check

# Every pull request, plus main after a merge. Not bare `on: push`, which would
# run this a second time for each PR branch and would also fire on the `v*`
# tags release.yml already builds.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      # Runs check-tokens.mjs first, then both vitest projects.
      - name: Test
        run: pnpm test

  rust:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            mobile/src-tauri

      - name: Test the desktop crate
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Check the mobile crate
        run: cargo check --manifest-path mobile/src-tauri/Cargo.toml

  # Its own job, so an advisory published overnight reads as an advisory and
  # not as a broken test run.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit npm dependencies
        run: pnpm audit --prod

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit desktop crates
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Audit mobile crates
        run: cargo audit --file mobile/src-tauri/Cargo.lock
