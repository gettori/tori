# Build, sign, notarize and publish a release when the release commit lands on
# main, the merge of the PR `scripts/release.sh prepare` opened. An ordinary
# merge moves no component's version, so the gate builds nothing; a fix merged
# after a failed run builds again only what no tag covers yet.
#
# Version scheme: YY.MDD.patch with a stage suffix while unstable, e.g.
# 26.824.0-alpha is the Aug 24 2026 alpha, 26.1205.0 a Dec 5 stable. The
# middle field is month*100+day (last two digits are always the day), so
# versions sort by date; the patch field is for a second cut of the same day.
#
# One DMG per Mac architecture rather than a universal binary: each bundle then
# comes out natively right down to the last resource, and the download is half
# the size. Android is arm64 only, which is every phone that can pair with a
# Mac; armv7 and x86 would quadruple that job for nobody.
#
# A tag pushed with github.token starts no workflow, which is why this one is
# not `on: tags`.
#
# Secrets live on the `release` environment, limited to main, so a workflow on
# a PR branch never sees them. docs/RELEASING.md lists them and where each
# comes from.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Build every component, not only the ones this commit releases"
        type: boolean
        default: false

# Two release commits merged back to back would otherwise race for the tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      macos: ${{ steps.decide.outputs.macos }}
      macos_version: ${{ steps.decide.outputs.macos_version }}
      android: ${{ steps.decide.outputs.android }}
      android_version: ${{ steps.decide.outputs.android_version }}
      extension: ${{ steps.decide.outputs.extension }}
      extension_version: ${{ steps.decide.outputs.extension_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide which components this commit releases
        id: decide
        env:
          ALL: ${{ inputs.all }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "rehearsal from $GITHUB_REF_NAME: publishing nothing"
          fi
          if [ "$ALL" = true ]; then
            scripts/release.sh gate --all >> "$GITHUB_OUTPUT"
          else
            scripts/release.sh gate >> "$GITHUB_OUTPUT"
          fi

      # The body comes from here, so a missing section fails in seconds, not
      # after a full compile.
      - name: Extract the release notes
        if: steps.decide.outputs.release == 'true' && github.event_name == 'push'
        run: .github/scripts/changelog-section.sh "${{ steps.decide.outputs.version }}"

  macos:
    needs: gate
    if: needs.gate.outputs.macos == 'true'
    # The runner's Xcode decides the SDK the app links against, and macOS
    # draws an app linked before SDK 26 with the old window chrome and
    # scrollbars. check-bundle.sh fails the build if that slips.
    runs-on: macos-26
    environment: release
    # Not fail-fast: a flake on one arch must not throw away the other's
    # notarization wait, and a re-run of the failed jobs then rebuilds one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
            dmg_arch: aarch64
            cli_arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
            dmg_arch: x64
            cli_arch: x64
    env:
      VERSION: ${{ needs.gate.outputs.macos_version }}
      BUNDLE: src-tauri/target/${{ matrix.target }}/release/bundle
      # Only the key's path is job-wide. The notary credentials are given to the
      # notarize steps alone, deliberately kept from `tauri build`: with them in
      # its environment Tauri notarizes the .app itself, a second submission
      # the DMG's makes redundant, with a wait that one dropped poll kills.
      APPLE_API_KEY_PATH: /tmp/tori-notary-key.p8
    steps:
      - uses: actions/checkout@v4

      - name: Write the notary key
        run: printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY_PATH"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}

      # Not left to Tauri's bundler, which imports into a keychain it hides
      # and reports only "failed to resolve signing identity" on any trouble.
      - name: Import the signing identity
        run: .github/scripts/import-signing-identity.sh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # The pinned version from rust-toolchain.toml, plus the one target this
      # job builds; the Intel one is a cross-compile on the arm64 runner.
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # Runs beforeBuildCommand, which installs the bundled LSP resources.
      # Retried because Tauri's bundle_dmg.sh lays the DMG window out through
      # Finder with AppleScript, and Finder on a GitHub runner fails that now
      # and then with no output; a second pass costs seconds, since the Rust
      # build is already done.
      - name: Build and sign the bundle
        run: |
          for attempt in 1 2 3; do
            pnpm tauri build --verbose --target ${{ matrix.target }} && exit 0
            echo "::warning::tauri build attempt $attempt failed, retrying"
            sleep 15
          done
          exit 1

      - name: Check every Mach-O is ${{ matrix.arch }} and the signature verifies
        run: .github/scripts/check-bundle.sh "$BUNDLE/macos/Tori.app" ${{ matrix.arch }}

      # Resolved explicitly rather than passing a glob to `gh`: an unmatched
      # glob reaches it as a literal path and the failure reads as a mangled
      # filename instead of "the build produced no DMG".
      - name: Sign, notarize and staple the DMG
        id: dmg
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          shopt -s nullglob
          dmgs=("$BUNDLE"/dmg/Tori_"$VERSION"_${{ matrix.dmg_arch }}.dmg)
          if [ ${#dmgs[@]} -ne 1 ]; then
            echo "expected $BUNDLE/dmg/Tori_${VERSION}_${{ matrix.dmg_arch }}.dmg, found: ${dmgs[*]-none}" >&2
            exit 1
          fi
          .github/scripts/notarize.sh "${dmgs[0]}"
          echo "path=${dmgs[0]}" >> "$GITHUB_OUTPUT"

      - name: Pack the app for in-app updates
        id: app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          path=$(.github/scripts/app-tarball.sh "$BUNDLE/macos/Tori.app" "$VERSION" ${{ matrix.dmg_arch }} "$BUNDLE/updater")
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # gettori/packs CI runs validate-pack and packs-index from this, pinned by
      # tag, so it ships with every release.
      - name: Pack the CLI
        id: cli
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          path=$(.github/scripts/cli-tarball.sh "$BUNDLE/macos/Tori.app" "$VERSION" ${{ matrix.cli_arch }} "$BUNDLE/cli")
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # The built binary, so it is this release's trusted keys that must verify
      # the live catalog: a release that cannot read the index would ship an
      # empty one. Only the runner's own arch can run.
      - name: Check the live packs catalog verifies with this build
        if: matrix.arch == 'arm64'
        run: '"$BUNDLE/macos/Tori.app/Contents/MacOS/tori" packs-catalog --check'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.app.outputs.path }}
            ${{ steps.cli.outputs.path }}
          if-no-files-found: error

  android:
    needs: gate
    if: needs.gate.outputs.android == 'true'
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.gate.outputs.android_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the SDK with ANDROID_HOME set; only the platform
      # Gradle compiles against has to be pinned, since the image's set drifts.
      - name: Install the Android platform
        run: |
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --install "platforms;android-36" >/dev/null

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - run: rustup toolchain install
      - run: rustup target add aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri
          key: aarch64-linux-android

      - run: pnpm install --frozen-lockfile

      # Android refuses to install an unsigned APK, and the Gradle signing
      # config falls back to unsigned when this file is missing rather than
      # failing, so the file is written first and the build checked after.
      - name: Write the keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE" ] || { echo "ANDROID_KEYSTORE secret is empty" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > mobile/src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build and sign the APK
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cd mobile && pnpm tauri android build --apk --target aarch64

      # One flavor, so one APK; anything else means the target list changed
      # without this step. Renamed to the asset name the docs give.
      - name: Check the APK is signed and name it
        id: apk
        run: |
          shopt -s nullglob
          apks=(mobile/src-tauri/gen/android/app/build/outputs/apk/*/release/app-*-release.apk)
          if [ ${#apks[@]} -ne 1 ]; then
            echo "expected one release APK, found ${#apks[@]}: ${apks[*]-none}" >&2
            exit 1
          fi
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "${apks[0]}"
          mv "${apks[0]}" "mobile/Tori_$VERSION.apk"
          echo "path=mobile/Tori_$VERSION.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

  # Needs only its own build, so a component that does not ship, or fails,
  # never holds this one back.
  publish-macos:
    needs: [gate, macos]
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.gate.outputs.macos_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: assets
          merge-multiple: true

      - name: Extract the release notes
        run: .github/scripts/changelog-section.sh "${{ needs.gate.outputs.version }}" > release-notes.md

      - name: Tag and publish the release
        if: github.event_name == 'push'
        run: |
          .github/scripts/publish.sh "macos-v$VERSION" "Tori v$VERSION for macOS" release-notes.md true assets \
            "Tori_${VERSION}_aarch64.dmg" "Tori_${VERSION}_x64.dmg" \
            "Tori_${VERSION}_aarch64.app.tar.gz" "Tori_${VERSION}_x64.app.tar.gz" \
            "tori-cli-$VERSION-macos-arm64.tar.gz" "tori-cli-$VERSION-macos-x64.tar.gz"

      - name: Point the Homebrew cask at it
        if: github.event_name == 'push'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: .github/scripts/update-cask.sh "$VERSION"

  publish-android:
    needs: [gate, android]
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.gate.outputs.android_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android
          path: assets

      - name: Extract the release notes
        run: .github/scripts/changelog-section.sh "${{ needs.gate.outputs.version }}" > release-notes.md

      # GitHub's latest release stays the Mac's, so the releases page leads
      # with a DMG.
      - name: Tag and publish the release
        if: github.event_name == 'push'
        run: .github/scripts/publish.sh "android-v$VERSION" "Tori v$VERSION for Android" release-notes.md false assets "Tori_$VERSION.apk"

  # Nothing else waits on this job, so a store failure goes red here on its
  # own. It submits staged; Publish stays a click. The tag gets no GitHub
  # release, since the store is where the extension is installed from.
  extension:
    needs: gate
    if: needs.gate.outputs.extension == 'true'
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.gate.outputs.extension_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the store zip
        id: zip
        run: echo "path=$(.github/scripts/extension-zip.sh out)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: extension
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

      - name: Tag the release commit
        if: github.event_name == 'push'
        run: |
          git tag "extension-v$VERSION" "$GITHUB_SHA"
          git push origin "extension-v$VERSION"

      - name: Upload and submit to the Chrome Web Store
        if: github.event_name == 'push'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: .github/scripts/extension-upload.sh --submit "${{ steps.zip.outputs.path }}"
