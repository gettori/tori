# Build, sign, notarize and publish a release when the release commit lands on
# main, the merge of the PR `scripts/release.sh prepare` opened. An ordinary
# merge moves no component's version, so the gate builds nothing; a fix merged
# after a failed run builds again only what no tag covers yet.
#
# Version scheme: YY.MDD.patch with a stage suffix while unstable, e.g.
# 26.824.0-alpha is the Aug 24 2026 alpha, 26.1205.0 a Dec 5 stable. The
# middle field is month*100+day (last two digits are always the day), so
# versions sort by date; the patch field is for a second cut of the same day.
#
# One DMG per Mac architecture rather than a universal binary: each bundle then
# comes out natively right down to the last resource, and the download is half
# the size. Android is arm64 only, which is every phone that can pair with a
# Mac; armv7 and x86 would quadruple that job for nobody.
#
# A tag pushed with github.token starts no workflow, which is why this one is
# not `on: tags`.
#
# Secrets live on the `release` environment, limited to main, so a workflow on
# a PR branch never sees them. docs/RELEASING.md lists them and where each
# comes from.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Build every component, not only the ones this commit releases"
        type: boolean
        default: false

# Two release commits merged back to back would otherwise race for the tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      macos: ${{ steps.decide.outputs.macos }}
      macos_version: ${{ steps.decide.outputs.macos_version }}
      android: ${{ steps.decide.outputs.android }}
      android_version: ${{ steps.decide.outputs.android_version }}
      extension: ${{ steps.decide.outputs.extension }}
      extension_version: ${{ steps.decide.outputs.extension_version }}
      relay: ${{ steps.decide.outputs.relay }}
      relay_version: ${{ steps.decide.outputs.relay_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide which components this commit releases
        id: decide
        env:
          ALL: ${{ inputs.all }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo "rehearsal from $GITHUB_REF_NAME: publishing nothing"
          fi
          if [ "$ALL" = true ]; then
            scripts/release.sh gate --all >> "$GITHUB_OUTPUT"
          else
            scripts/release.sh gate >> "$GITHUB_OUTPUT"
          fi

      # The body comes from here, so a missing section fails in seconds, not
      # after a full compile.
      - name: Extract the release notes
        if: steps.decide.outputs.release == 'true' && github.event_name == 'push'
        run: .github/scripts/changelog-section.sh "${{ steps.decide.outputs.version }}"

  # pnpm install runs every build script the lockfile pulls in, so no job that
  # builds holds a secret, and the sign jobs never run what a build made.
  build-macos:
    needs: gate
    if: needs.gate.outputs.macos == 'true'
    # The runner's Xcode decides the SDK the app links against, and macOS
    # draws an app linked before SDK 26 with the old window chrome and
    # scrollbars. check-bundle.sh fails the build if that slips.
    runs-on: macos-26
    # Not fail-fast: a flake on one arch must not throw away the other's
    # notarization wait, and a re-run of the failed jobs then rebuilds one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    env:
      BUNDLE: src-tauri/target/${{ matrix.target }}/release/bundle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # The app only: the DMG is made after signing, and with no identity in
      # reach Tauri signs nothing.
      - name: Build the app
        run: pnpm tauri build --verbose --target ${{ matrix.target }} --bundles app

      # Both run the built binary, so they run here and not beside the key.
      - name: Check the binary answers as the tori CLI
        if: matrix.arch == 'arm64'
        run: .github/scripts/check-cli.sh "$BUNDLE/macos/Tori.app"

      # The built binary, so it is this release's trusted keys that must verify
      # the live catalog: a release that cannot read the index would ship an
      # empty one. Only the runner's own arch can run.
      - name: Check the live packs catalog verifies with this build
        if: matrix.arch == 'arm64'
        run: '"$BUNDLE/macos/Tori.app/Contents/MacOS/tori" packs-catalog --check'

      # upload-artifact drops symlinks and exec bits, which a bundle needs.
      - name: Pack the unsigned app
        run: COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/Tori.app.tar.gz" -C "$BUNDLE/macos" Tori.app

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-unsigned-${{ matrix.arch }}
          path: ${{ runner.temp }}/Tori.app.tar.gz
          if-no-files-found: error

  sign-macos:
    needs: [gate, build-macos]
    runs-on: macos-26
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            dmg_arch: aarch64
            cli_arch: arm64
          - arch: x86_64
            dmg_arch: x64
            cli_arch: x64
    env:
      VERSION: ${{ needs.gate.outputs.macos_version }}
      APP: ${{ github.workspace }}/unsigned/Tori.app
      OUT: ${{ github.workspace }}/out
      APPLE_API_KEY_PATH: /tmp/tori-notary-key.p8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            src-tauri/Entitlements.plist
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-unsigned-${{ matrix.arch }}
          path: unsigned

      - name: Unpack the app
        run: tar -xzf unsigned/Tori.app.tar.gz -C unsigned

      - name: Write the notary key
        run: printf '%s' "$APPLE_API_KEY_CONTENT" > "$APPLE_API_KEY_PATH"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}

      # Not left to Tauri's bundler, which imports into a keychain it hides
      # and reports only "failed to resolve signing identity" on any trouble.
      - name: Import the signing identity
        run: .github/scripts/import-signing-identity.sh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Sign the app inside out
        run: .github/scripts/sign-app.sh "$APP" src-tauri/Entitlements.plist

      - name: Check every Mach-O is ${{ matrix.arch }} and the signature verifies
        run: .github/scripts/check-bundle.sh "$APP" ${{ matrix.arch }}

      - name: Build, notarize and staple the DMG
        id: dmg
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          dmg=$(.github/scripts/make-dmg.sh "$APP" "$OUT/dmg/Tori_${VERSION}_${{ matrix.dmg_arch }}.dmg")
          .github/scripts/notarize.sh "$dmg"
          echo "path=$dmg" >> "$GITHUB_OUTPUT"

      - name: Pack the app for in-app updates
        id: app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          path=$(.github/scripts/app-tarball.sh "$APP" "$VERSION" ${{ matrix.dmg_arch }} "$OUT/updater")
          echo "path=$path" >> "$GITHUB_OUTPUT"

      # gettori/packs CI runs validate-pack and packs-index from this, pinned by
      # tag, so it ships with every release.
      - name: Pack the CLI
        id: cli
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          path=$(.github/scripts/cli-tarball.sh "$APP" "$VERSION" ${{ matrix.cli_arch }} "$OUT/cli")
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}
          path: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.app.outputs.path }}
            ${{ steps.cli.outputs.path }}
          if-no-files-found: error

  build-android:
    needs: gate
    if: needs.gate.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      # The runner image ships the SDK with ANDROID_HOME set; only the platform
      # Gradle compiles against has to be pinned, since the image's set drifts.
      - name: Install the Android platform
        run: |
          sdkmanager=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --install "platforms;android-36" >/dev/null

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: ndk
        with:
          ndk-version: r28c

      - run: rustup toolchain install
      - run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: mobile/src-tauri
          key: aarch64-linux-android

      - run: pnpm install --frozen-lockfile

      - name: Build the APK and the AAB unsigned
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ORG_GRADLE_PROJECT_unsigned: "true"
        run: cd mobile && pnpm tauri android build --apk --aab --target aarch64

      # Play rejects native code that is not 16 KB aligned for apps targeting
      # Android 15 and later; r28 is the first NDK whose linker defaults to it.
      - name: Check the AAB is 16 KB aligned and collect both
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          shopt -s nullglob
          apks=(mobile/src-tauri/gen/android/app/build/outputs/apk/*/release/app-*-release-unsigned.apk)
          aabs=(mobile/src-tauri/gen/android/app/build/outputs/bundle/*Release/app-*-release.aab)
          if [ ${#apks[@]} -ne 1 ] || [ ${#aabs[@]} -ne 1 ]; then
            echo "expected one release APK and one AAB, found: ${apks[*]-no APK} ${aabs[*]-no AAB}" >&2
            exit 1
          fi
          libs="$RUNNER_TEMP/aab-libs"
          unzip -q -o "${aabs[0]}" 'base/lib/*.so' -d "$libs"
          sos=("$libs"/base/lib/*/*.so)
          [ ${#sos[@]} -gt 0 ] || { echo "no native libraries in the AAB" >&2; exit 1; }
          readelf=$(ls "$NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-readelf | head -1)
          for so in "${sos[@]}"; do
            for align in $("$readelf" -lW "$so" | awk '$1 == "LOAD" { print $NF }'); do
              if [ $((align)) -lt 16384 ]; then
                echo "$so has a LOAD segment aligned to $align, below 16 KB" >&2
                exit 1
              fi
            done
          done
          mkdir -p "$RUNNER_TEMP/unsigned"
          mv "${apks[0]}" "$RUNNER_TEMP/unsigned/unsigned.apk"
          mv "${aabs[0]}" "$RUNNER_TEMP/unsigned/unsigned.aab"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          path: ${{ runner.temp }}/unsigned
          if-no-files-found: error

  sign-android:
    needs: [gate, build-android]
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.gate.outputs.android_version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: unsigned

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - name: Write the keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          [ -n "$ANDROID_KEYSTORE" ] || { echo "ANDROID_KEYSTORE secret is empty" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Android refuses to install an unsigned APK, and jarsigner exits 0 on
      # an unsigned file too, so each verdict is read back after signing.
      - name: Sign and check the APK and the AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ks="$RUNNER_TEMP/release.jks"
          mkdir -p signed
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" sign --ks "$ks" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "signed/Tori_$VERSION.apk" unsigned/unsigned.apk
          "$apksigner" verify --print-certs "signed/Tori_$VERSION.apk"
          jarsigner -keystore "$ks" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
            -signedjar "signed/Tori_$VERSION.aab" unsigned/unsigned.aab "$ANDROID_KEY_ALIAS"
          jarsigner -verify "signed/Tori_$VERSION.aab" | tee "$RUNNER_TEMP/jarsigner.txt"
          grep -qx 'jar verified.' "$RUNNER_TEMP/jarsigner.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: signed
          if-no-files-found: error

  # Needs only its own build, so a component that does not ship, or fails,
  # never holds this one back.
  publish-macos:
    needs: [gate, sign-macos]
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.gate.outputs.macos_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: macos-*
          path: assets
          merge-multiple: true

      - name: Extract the release notes
        run: .github/scripts/changelog-section.sh "${{ needs.gate.outputs.version }}" > release-notes.md

      - name: Tag and publish the release
        if: github.event_name == 'push'
        run: |
          .github/scripts/publish.sh "macos-v$VERSION" "Tori v$VERSION for macOS" release-notes.md true assets \
            "Tori_${VERSION}_aarch64.dmg" "Tori_${VERSION}_x64.dmg" \
            "Tori_${VERSION}_aarch64.app.tar.gz" "Tori_${VERSION}_x64.app.tar.gz" \
            "tori-cli-$VERSION-macos-arm64.tar.gz" "tori-cli-$VERSION-macos-x64.tar.gz"

      - name: Point the Homebrew cask at it
        if: github.event_name == 'push'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: .github/scripts/update-cask.sh "$VERSION"

  publish-android:
    needs: [gate, sign-android]
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.gate.outputs.android_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: assets

      - name: Extract the release notes
        run: .github/scripts/changelog-section.sh "${{ needs.gate.outputs.version }}" > release-notes.md

      # GitHub's latest release stays the Mac's, so the releases page leads
      # with a DMG.
      - name: Tag and publish the release
        if: github.event_name == 'push'
        run: .github/scripts/publish.sh "android-v$VERSION" "Tori v$VERSION for Android" release-notes.md false assets "Tori_$VERSION.apk"

  # Beside publish-android rather than after it, so a Play failure leaves the
  # GitHub release alone. Push only: a dispatch builds an unbumped version
  # whose versionCode Play already has.
  publish-play:
    needs: [gate, sign-android]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.gate.outputs.android_version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android
          path: assets

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.gettori.tori.mobile
          releaseFiles: assets/Tori_${{ env.VERSION }}.aab
          track: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: ${{ vars.PLAY_STATUS || 'completed' }}

  # Nothing else waits on this job, so a store failure goes red here on its
  # own. The store publishes it once the review passes. The tag gets no GitHub
  # release, since the store is where the extension is installed from.
  extension:
    needs: gate
    if: needs.gate.outputs.extension == 'true'
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.gate.outputs.extension_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the store zip
        id: zip
        run: echo "path=$(.github/scripts/extension-zip.sh out)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: extension
          path: ${{ steps.zip.outputs.path }}
          if-no-files-found: error

      - name: Tag the release commit
        if: github.event_name == 'push'
        run: |
          git tag "extension-v$VERSION" "$GITHUB_SHA"
          git push origin "extension-v$VERSION"

      - name: Upload and submit to the Chrome Web Store
        if: github.event_name == 'push'
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: .github/scripts/extension-upload.sh --submit "${{ steps.zip.outputs.path }}"

  # Deployed before it is tagged, so a failed deploy leaves no tag and the next
  # run tries again. A rehearsal only checks that it bundles.
  relay:
    needs: gate
    if: needs.gate.outputs.relay == 'true'
    runs-on: ubuntu-latest
    environment: release
    env:
      VERSION: ${{ needs.gate.outputs.relay_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Bundle without deploying
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --dir relay run deploy:dry

      - name: Deploy to Cloudflare
        if: github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm --dir relay run deploy

      - name: Tag the release commit
        if: github.event_name == 'push'
        run: |
          git tag "relay-v$VERSION" "$GITHUB_SHA"
          git push origin "relay-v$VERSION"
