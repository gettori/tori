# Draft a GitHub Release from a `v*` tag: build the universal macOS bundle,
# prove it really is universal, and attach the DMG.
#
# Version scheme: YY.MDD.patch with a stage suffix while unstable, e.g.
# 26.824.0-alpha is the Aug 24 2026 alpha, 26.1205.0 a Dec 5 stable. The
# middle field is month*100+day (last two digits are always the day), so
# versions sort by date; the patch field is for a second cut of the same day.
#
# The source repo is private, so the release is drafted on the public
# gettori/releases repo instead. That needs RELEASES_TOKEN, a fine-grained
# PAT with Contents read/write on gettori/releases (github.token only reaches this
# repo). No signing secrets - v0.1 ships unsigned. The release is left as a
# *draft* on purpose: an unsigned build needs the Gatekeeper note in
# docs/INSTALL.md alongside it, and that is a human's call to publish. After
# publishing, the cask workflow (cask.yml) points the Homebrew tap at it.
name: Release

on:
  push:
    tags: ["v*"]
  # Rehearsal trigger. A tag is immutable in practice once the repo is public,
  # so the first real tag should not also be the first time this workflow runs.
  # Dispatched from a branch it does everything a tag run does - build, arch
  # sweep, DMG - but uploads the DMG as an artifact instead of drafting a
  # release, so nothing is published and no throwaway tag is left behind.
  workflow_dispatch:

# Only to create the release; nothing here pushes commits.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # On a tag run the tag is the source of truth, and the next step proves
      # the app agrees with it. A rehearsal has no tag to read, so it takes the
      # app's own version instead - which is the value the eventual tag has to
      # match anyway, so the rehearsal exercises the real release notes.
      - name: Derive the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "rehearsal run: using the app's own version, $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with the app's own version would ship a build
      # that reports the wrong version in its update check, and would look for
      # a changelog section that describes something else.
      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        run: |
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          want="${{ steps.version.outputs.version }}"
          if [ "$conf" != "$want" ]; then
            echo "tag $GITHUB_REF_NAME implies version $want, but tauri.conf.json says $conf" >&2
            exit 1
          fi

      # Done before the long build: a missing changelog section should fail in
      # seconds, not after a full universal compile.
      - name: Extract the release notes
        run: |
          .github/scripts/changelog-section.sh "${{ steps.version.outputs.version }}" \
            > release-notes.md
          echo "--- release body ---"
          cat release-notes.md

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both halves of the universal binary.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Runs beforeBuildCommand, which installs the bundled LSP resources.
      - name: Build the universal bundle
        run: pnpm tauri build --target universal-apple-darwin

      - name: Report the main binary's architectures
        run: lipo -archs "src-tauri/target/universal-apple-darwin/release/bundle/macos/Tori.app/Contents/MacOS/Tori"

      - name: Verify every bundled Mach-O is universal
        run: |
          .github/scripts/check-universal.sh \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/Tori.app"

      # Resolved explicitly rather than passing a glob to `gh`: an unmatched
      # glob reaches it as a literal path and the failure reads as a mangled
      # filename instead of "the build produced no DMG".
      - name: Locate the DMG
        id: dmg
        run: |
          shopt -s nullglob
          dmgs=(src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "no DMG in src-tauri/target/universal-apple-darwin/release/bundle/dmg/" >&2
            exit 1
          fi
          if [ ${#dmgs[@]} -gt 1 ]; then
            echo "expected one DMG, found ${#dmgs[@]}: ${dmgs[*]}" >&2
            exit 1
          fi
          echo "path=${dmgs[0]}" >> "$GITHUB_OUTPUT"

      # The cask needs this checksum; printing it here lets a manual cask edit
      # copy it straight from the build that produced the DMG.
      - name: Report the DMG checksum
        run: shasum -a 256 "${{ steps.dmg.outputs.path }}"

      # Drafted on the public releases repo, not here: the source is private,
      # so its release assets would not be downloadable by testers or by brew.
      # gh creates the tag on that repo's default branch, which carries no
      # meaning there - the repo only holds artifacts.
      - name: Draft the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          flags=(--draft)
          case "${{ steps.version.outputs.version }}" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo gettori/releases \
            "${flags[@]}" \
            --title "Tori $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "${{ steps.dmg.outputs.path }}"

      # The rehearsal's payoff: a real DMG to install and check by hand before
      # any tag exists, so the Gatekeeper steps in docs/INSTALL.md are verified
      # against an actual artifact rather than assumed.
      - name: Upload the rehearsal DMG
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: tori-rehearsal-dmg
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error
