[package]
name = "tori-mobile"
version = "26.927.0-alpha"
description = "Tori on a phone: the chats of a paired Tori, over its remote front"
edition = "2021"

[lib]
name = "tori_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# generate_context! emits serde_json for the plugins config.
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
