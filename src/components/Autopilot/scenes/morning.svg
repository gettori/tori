<svg class="tori-scene" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 176" preserveAspectRatio="xMaxYMax slice"><style>.ts-d{animation:ts-drift linear infinite}@keyframes ts-drift{to{transform:translateX(-600px)}}.ts-tw{animation:ts-tw 4s ease-in-out infinite}@keyframes ts-tw{0%,100%{opacity:.2}50%{opacity:1}}.ts-glow{transform-box:fill-box;transform-origin:center;animation:ts-glow 7s ease-in-out infinite}@keyframes ts-glow{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.07)}}.ts-sh{animation:ts-sh 3.2s ease-in-out infinite}@keyframes ts-sh{0%,100%{opacity:.15}50%{opacity:.85}}.ts-cl{animation:ts-cl linear infinite}@keyframes ts-cl{from{transform:translateX(-280px)}to{transform:translateX(1320px)}}.ts-bob{transform-box:fill-box;transform-origin:50% 100%;animation:ts-bob 5s ease-in-out infinite}@keyframes ts-bob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg) translateY(1.5px)}}.ts-sway{animation:ts-sway 40s ease-in-out infinite alternate}@keyframes ts-sway{to{transform:translateX(-50px)}}.ts-fl{animation:ts-fl linear infinite}@keyframes ts-fl{from{transform:translate(-120px,14px)}to{transform:translate(1320px,-18px)}}.ts-fp{transform-box:fill-box;transform-origin:center;animation:ts-fp .9s ease-in-out infinite}@keyframes ts-fp{50%{transform:scaleY(.35)}}.ts-mi{animation:ts-mi 30s ease-in-out infinite alternate}@keyframes ts-mi{to{transform:translateX(-90px)}}.ts-bm{transform-box:view-box;transform-origin:1150px 76px;animation:ts-bm 9s ease-in-out infinite}@keyframes ts-bm{0%,100%{transform:scaleX(1);opacity:.55}25%,75%{transform:scaleX(.05);opacity:.1}50%{transform:scaleX(-1);opacity:.55}}.ts-ss{stroke-dasharray:50 300;stroke-dashoffset:350;animation:ts-ss 12s ease-out infinite}@keyframes ts-ss{0%,84%{stroke-dashoffset:350;opacity:0}86%{opacity:1}95%{stroke-dashoffset:0;opacity:0}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.tori-scene,.tori-scene *{animation:none!important}}</style><defs><linearGradient id="morning-