[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
# Both halves of the universal macOS bundle, plus windows-gnu to check (never
# build) the Windows arms from a Mac. The Android targets stay with
# scripts/release.sh, which adds them before its APK build.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-gnu"]
